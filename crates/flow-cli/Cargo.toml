[package]
name = "flow-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "flow"
path = "src/main.rs"

[dependencies]
flow-capability = { path = "../flow-capability" }
flow-compiler = { path = "../flow-compiler" }
flow-http = { path = "../flow-http" }
flow-runtime = { path = "../flow-runtime" }
flow-syntax = { path = "../flow-syntax" }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal", "time"] }

[lints]
workspace = true
